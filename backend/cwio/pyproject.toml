[project]
name = "cwio"
version = "0.1.0"
description = "CargoWise One I/O utility using SQL Server for reads and eAdaptor for writes"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "np>=1.0.2",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "pyodbc>=5.3.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
    "tenacity>=9.1.4",
    "xsdata-pydantic>=24.5",
]
