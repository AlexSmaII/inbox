[project]
name = "pod-automation"
version = "0.1.0"
description = "Extracts data from scanned POD dockets and pushes them to CW1 eDocs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cwio",
    "fastapi[standard]>=0.141.1",
    "genai-prices>=0.1.4",
    "google-genai>=2.20.0",
    "ipykernel>=7.3.0",
    "natsort>=8.4.0",
    "np>=1.0.2",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pydantic-evals>=2.35.1",
    "pyodbc>=5.3.0",
    "pypdfium2>=5.13.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
    "tenacity>=9.1.4",
    "xsdata-pydantic>=24.5",
]

[tool.uv.workspace]
members = [
    "cwio",
]

[tool.uv.sources]
cwio = { workspace = true, editable = true }
